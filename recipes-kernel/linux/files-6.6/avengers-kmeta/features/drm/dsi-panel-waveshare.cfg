# Waveshare 10.1inch DSI panel (1280x800, 2 lanes) with Goodix GT911 touch.
# BACKLIGHT_CLASS_DEVICE is the gate: DRM_PANEL_WAVESHARE_TOUCHSCREEN depends
# on it, and without it the panel driver is silently dropped from the build.
CONFIG_BACKLIGHT_CLASS_DEVICE=y

# Built as a module on purpose: it can then be reloaded without a reboot,
# which is how the DSI link is re-programmed after a panel change.
CONFIG_DRM_PANEL_WAVESHARE_TOUCHSCREEN=m

CONFIG_INPUT_TOUCHSCREEN=y
