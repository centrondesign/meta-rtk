# Telit LN920A6-WW
#
# Per 1VV0301371 Rev.20 (Telit Modules Linux USB Drivers User Guide) the
# LN920 series is a USB device, supported since kernel 5.15. It exposes
# VID 0x1bc7 with these compositions:
#
#   0x1060  5 reduced ACM + rmnet  + ADB  -> option + qmi_wwan
#   0x1061  5 reduced ACM + MBIM   + ADB  -> option + cdc_mbim
#   0x1062  5 reduced ACM + RNDIS  + ADB  -> option + rndis_host
#   0x1063  5 reduced ACM + ECM    + ADB  -> option + cdc_ether
#
# The flashing device is 0x1bc7:0x9010, also bound by option (/dev/ttyUSBx).
# There is no MHI/PCIe path for this module.

# Serial/AT ports -> /dev/ttyUSBx  (OPTION selects USB_SERIAL_WWAN)
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_WWAN=m
CONFIG_USB_SERIAL_OPTION=m

# Network data path (QMI_WWAN and CDC_MBIM both select USB_WDM;
# CDC_MBIM additionally selects USB_NET_CDC_NCM)
CONFIG_USB_USBNET=m
CONFIG_USB_WDM=m
CONFIG_USB_NET_QMI_WWAN=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_CDC_MBIM=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_RNDIS_HOST=m
