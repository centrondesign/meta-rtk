# Debian-equivalent feature coverage for a general purpose kernel.
#
# Derived by diffing this board config against the Debian arm64 config
# from linux-image-6.6.15-arm64-unsigned_6.6.15-2_arm64.deb
# (snapshot.debian.org, 2024-02-06). Debian 6.6.15 vs this tree 6.6.77,
# so the symbol namespace matches and the values transfer cleanly.
#
# Deliberately EXCLUDED from the full Debian delta: desktop GPU drivers
# (amdgpu/i915), other vendors wifi, KVM/VFIO, IMA/EVM, and the long tail
# of USB and storage drivers -- none apply to this board.
#
# NOTE: a fragment is a request, not a guarantee. Symbols whose
# dependencies are unmet are dropped silently by kconfig; check the
# resulting .config rather than assuming these all took effect.

#
# Container / cgroup -- required by Docker, Podman and systemd resource control.
# Without MEMCG the memory limits of all three silently do nothing.
#
CONFIG_BLK_CGROUP_IOCOST=y
CONFIG_BLK_CGROUP_PUNT_BIO=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_MISC=y
CONFIG_CGROUP_NET_CLASSID=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_WRITEBACK=y
CONFIG_MEMCG=y
CONFIG_MEMCG_KMEM=y
CONFIG_CPUSETS=y

