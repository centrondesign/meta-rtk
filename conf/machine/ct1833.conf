#@TYPE: Machine
#@NAME: Realtek Stark based Centron Design board
#@DESCRIPTION: Machine configuration for the Centron Design board

MACHINE_FEATURES := "drm mali v4l2"
MACHINE_FEATURES += "npu"
MACHINE_FEATURES += "vendor-bt"
MACHINE_FEATURES += "vendor-wifi"
MACHINE_FEATURES += "dsi-panel"
KMACHINE := "bleedingedge-rtd1619b"

include conf/machine/include/stark-centron.inc

IMAGE_SRC_FILE:ct1833 = "image-centron.its"

KERNEL_DTC_FLAGS += "-@"
DT_OVERLAYS = "kms-dsi-waveshare-panel-overlay"

# extra kernel config fragment, kept next to this machine conf
FILESEXTRAPATHS:prepend:pn-linux-yocto := "${@os.path.dirname(d.getVar("FILE"))}:"
SRC_URI:append:pn-linux-yocto = " file://debian.cfg"
