#@TYPE: Machine
#@NAME: Realtek Kent based Phantom EVM board and video codec only
#@DESCRIPTION: Machine configuration for the RTD1625 Phantom board for console and video codec only applications

PREFERRED_VERSION_linux-yocto ?= "5.10%"
#PREFERRED_VERSION_linux-yocto ?= "6.12%"
MACHINE_FEATURES += "v4l2"
include conf/machine/include/kent.inc
include conf/machine/include/nogui.inc

IMAGE_INSTALL:append = " ${@bb.utils.contains('MACHINE_FEATURES', 'v4l2', 'linux-firmware-rtd1625', '', d)}"
IMAGE_INSTALL:append = " pcibr-iodrv"

UBOOT_CONFIG ?= "rtd1625_emmc rtd1625_spi"
IMAGE_BOOT_FILES += " u-boot.bin-rtd1625_spi"

# SPI-NAND
IMAGE_FSTYPES:append = " ubi ubifs"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 1023"
UBINIZE_ARGS = "-m 2048 -p 128KiB"
IMAGE_INSTALL:append = " mtd-utils-ubifs"

# First dtb is boot.dtb in default "normal" configurations
KERNEL_DEVICETREE:prepend = " realtek/rtd1501s-phantom-1gb.dtb"

# for linux-yocto_5.10
MACHINE_FEATURES:remove = "vendor-wifi"
