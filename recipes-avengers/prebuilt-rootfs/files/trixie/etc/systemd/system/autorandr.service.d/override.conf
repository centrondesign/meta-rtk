[Unit]
After=lightdm.service
Wants=lightdm.service
# The drm-hotplug udev rule (40-monitor-hotplug.rules) restarts this unit on
# every HDMI plug/unplug and on the late-EDID event during boot. The stock
# StartLimitIntervalSec=5 / StartLimitBurst=1 lets an early HPD bounce eat the
# only allowed start and then blocks the meaningful one. Disable the throttle.
StartLimitIntervalSec=0

[Service]
Environment=DISPLAY=:0
Environment=XAUTHORITY=/run/lightdm/root/:0
# See /usr/libexec/rtk-hdmi-hotplug: the drm "change" uevent fires before the
# kernel EDID / X RandR state are ready, so a single "xrandr --auto" no-ops and
# the screen stays blank until a manual re-run. The helper retries until the
# connector actually comes up.
ExecStart=
ExecStart=/usr/libexec/rtk-hdmi-hotplug

[Install]
WantedBy=lightdm.service
